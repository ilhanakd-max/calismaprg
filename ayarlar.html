<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dış Birim Mesai Takip Sistemi - Ayarlar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; display: flex; flex-direction: column; min-height: 100vh; }
        .navbar-brand { font-weight: 600; min-width: 0; max-width: 50vw; line-height: 1.2; font-size: clamp(0.95rem, 2.4vw, 1.25rem); overflow-wrap: break-word; word-break: break-word; }
        @media (max-width: 991.98px) { .navbar-brand { max-width: 68vw; font-size: clamp(0.9rem, 3vw, 1.1rem); } }
        .content-wrapper { padding-top: 20px; padding-bottom: 40px; flex: 1; }
    </style>
</head>
<body>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/db.js"></script>
    <script src="assets/js/app.js"></script>

    <script>
        document.addEventListener('appReady', async function() {
            if (!(await DB.isAdmin())) {
                document.getElementById('main-content').innerHTML = '<div class="alert alert-danger">Bu sayfaya erişim yetkiniz yoktur.</div>';
                return;
            }

            const html = `
            <div class="row">
                <div class="col-12">
                    <div id="mesaj-alani"></div>

                    <!-- Sistem Ayarları -->
                    <div class="card mb-4 shadow-sm border-0 border-top border-primary border-3">
                        <div class="card-header bg-white py-3">
                            <h5 class="mb-0 fw-bold text-primary"><i class="fa-solid fa-cogs me-2"></i> Sistem Ayarları</h5>
                        </div>
                        <div class="card-body">
                            <form id="formAyarlar">
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Site Başlığı</label>
                                    <input type="text" class="form-control" id="ayar_site_baslik" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">İzin Göstergesi (Anasayfa & Mesai Listesi)</label>
                                    <select class="form-select" id="ayar_izin_gosterge_goster">
                                        <option value="1">Göster</option>
                                        <option value="0">Gizle</option>
                                    </select>
                                </div>

                                <hr>
                                <h6 class="fw-bold mb-3 mt-4 text-secondary">Renk Ayarları</h6>
                                <div class="row mb-3">
                                    <div class="col-md-3">
                                        <label class="form-label fw-bold" style="color: #0f5132;">Çalışıyor (Arkaplan)</label>
                                        <input type="color" class="form-control form-control-color w-100" id="ayar_renk_calisiyor_bg" value="#d1e7dd">
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label fw-bold" style="color: #0f5132;">Çalışıyor (Yazı)</label>
                                        <input type="color" class="form-control form-control-color w-100" id="ayar_renk_calisiyor_text" value="#0f5132">
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label fw-bold" style="color: #664d03;">İzinli (Arkaplan)</label>
                                        <input type="color" class="form-control form-control-color w-100" id="ayar_renk_izinli_bg" value="#fff3cd">
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label fw-bold" style="color: #664d03;">İzinli (Yazı)</label>
                                        <input type="color" class="form-control form-control-color w-100" id="ayar_renk_izinli_text" value="#664d03">
                                    </div>
                                </div>
                                <div class="row mb-4">
                                    <div class="col-md-3">
                                        <label class="form-label fw-bold" style="color: #842029;">Raporlu (Arkaplan)</label>
                                        <input type="color" class="form-control form-control-color w-100" id="ayar_renk_raporlu_bg" value="#f8d7da">
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label fw-bold" style="color: #842029;">Raporlu (Yazı)</label>
                                        <input type="color" class="form-control form-control-color w-100" id="ayar_renk_raporlu_text" value="#842029">
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label fw-bold" style="color: #6c757d;">Kayıt Yok (Arkaplan)</label>
                                        <input type="color" class="form-control form-control-color w-100" id="ayar_renk_kayityok_bg" value="#f8f9fa">
                                    </div>
                                    <div class="col-md-3">
                                        <label class="form-label fw-bold" style="color: #6c757d;">Kayıt Yok (Yazı)</label>
                                        <input type="color" class="form-control form-control-color w-100" id="ayar_renk_kayityok_text" value="#6c757d">
                                    </div>
                                </div>

                                <div class="text-end">
                                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-save"></i> Ayarları Kaydet</button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Yönetici Hesapları -->
                    <div class="card mb-4 shadow-sm border-0 border-top border-warning border-3">
                        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                            <h5 class="mb-0 fw-bold text-warning"><i class="fa-solid fa-user-shield me-2"></i> Yönetici Hesapları</h5>
                        </div>
                        <div class="card-body">
                            <div class="alert alert-info">
                                <i class="fa-solid fa-circle-info me-2"></i>
                                <strong>Yönetici Bilgisi:</strong> Bu sistemde yönetici hesapları <strong>Supabase Authentication</strong> üzerinden yönetilmektedir.
                                Yeni yönetici eklemek veya mevcut hesapları düzenlemek için:
                                <a href="https://supabase.com/dashboard" target="_blank" class="btn btn-sm btn-outline-primary ms-2">
                                    <i class="fa-solid fa-external-link-alt me-1"></i> Supabase Paneline Git
                                </a>
                            </div>
                            <div class="mt-3">
                                <h6 class="fw-bold">Şu Anda Giriş Yapan Hesap:</h6>
                                <div class="d-flex align-items-center">
                                    <span class="badge bg-primary fs-6 me-2"><i class="fa-solid fa-user-circle me-1"></i><span id="admin-email-goster">Yükleniyor...</span></span>
                                    <span class="text-muted small">Çıkış yapmak için üst menüden "Çıkış Yap" butonunu kullanın.</span>
                                </div>
                            </div>
                            <div class="mt-3 p-3 bg-light rounded">
                                <h6 class="fw-bold text-muted"><i class="fa-solid fa-info-circle me-1"></i> Yeni Yönetici Eklemek İçin:</h6>
                                <ol class="mb-0 small text-muted">
                                    <li>Supabase paneline gidin ve projenizi açın.</li>
                                    <li>Sol menüden <strong>Authentication → Users</strong> seçeneğine tıklayın.</li>
                                    <li><strong>"Add User"</strong> butonuna tıklayın.</li>
                                    <li>E-posta ve şifre belirleyin, <em>"Auto Confirm User"</em> seçeneğini işaretleyin ve kaydedin.</li>
                                </ol>
                            </div>
                        </div>
                    </div>

                    <!-- Resmi Tatiller -->
                    <div class="card shadow-sm border-0 border-top border-danger border-3">
                        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                            <h5 class="mb-0 fw-bold text-danger"><i class="fa-solid fa-star me-2"></i> Resmi Tatiller</h5>
                            <button class="btn btn-sm btn-outline-danger" data-bs-toggle="modal" data-bs-target="#tatilEkleModal">
                                <i class="fa-solid fa-plus"></i> Yeni Tatil Ekle
                            </button>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-hover align-middle mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Tarih (Ay-Gün)</th>
                                            <th>Tatil Adı</th>
                                            <th class="text-end pe-4">İşlem</th>
                                        </tr>
                                    </thead>
                                    <tbody id="tatiller-table-body">
                                        <tr><td colspan="3"><div class="spinner-border text-danger my-3" role="status"></div></td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- TATİL EKLE MODAL -->
            <div class="modal fade" id="tatilEkleModal" tabindex="-1" aria-hidden="true">
              <div class="modal-dialog">
                <div class="modal-content">
                  <form id="formAddTatil">
                      <div class="modal-header bg-light">
                        <h5 class="modal-title"><i class="fa-solid fa-calendar-plus text-danger"></i> Yeni Resmi Tatil Ekle</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                      </div>
                      <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Tarih (Ay-Gün)</label>
                            <input type="text" class="form-control" id="tatil_gun_ay" placeholder="Örn: 04-23 veya 10-29" required pattern="^(0[1-9]|1[0-2])-(0[1-9]|[12]\\d|3[01])$">
                            <div class="form-text">Lütfen MM-DD (Ay-Gün) formatında giriniz (Örn: 23 Nisan için 04-23).</div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tatil Adı</label>
                            <input type="text" class="form-control" id="tatil_aciklama" required>
                        </div>
                      </div>
                      <div class="modal-footer border-0">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Kapat</button>
                        <button type="submit" class="btn btn-danger">Kaydet</button>
                      </div>
                  </form>
                </div>
              </div>
            </div>
            `;
            
            document.getElementById('main-content').insertAdjacentHTML('beforeend', html);
            
            // Ayarları yükle
            document.getElementById('ayar_site_baslik').value = await DB.getAyar('site_baslik') || 'Dış Birim Mesai Takip Sistemi';
            document.getElementById('ayar_izin_gosterge_goster').value = await DB.getAyar('izin_gosterge_goster') || '1';
            
            document.getElementById('ayar_renk_calisiyor_bg').value = await DB.getAyar('renk_calisiyor_bg') || '#d1e7dd';
            document.getElementById('ayar_renk_calisiyor_text').value = await DB.getAyar('renk_calisiyor_text') || '#0f5132';
            document.getElementById('ayar_renk_izinli_bg').value = await DB.getAyar('renk_izinli_bg') || '#fff3cd';
            document.getElementById('ayar_renk_izinli_text').value = await DB.getAyar('renk_izinli_text') || '#664d03';
            document.getElementById('ayar_renk_raporlu_bg').value = await DB.getAyar('renk_raporlu_bg') || '#f8d7da';
            document.getElementById('ayar_renk_raporlu_text').value = await DB.getAyar('renk_raporlu_text') || '#842029';
            document.getElementById('ayar_renk_kayityok_bg').value = await DB.getAyar('renk_kayityok_bg') || '#f8f9fa';
            document.getElementById('ayar_renk_kayityok_text').value = await DB.getAyar('renk_kayityok_text') || '#6c757d';
            
            // Admin email goster
            const kullaniciAdi = await DB.getKullaniciAdi();
            const emailSpan = document.getElementById('admin-email-goster');
            if (emailSpan) emailSpan.textContent = kullaniciAdi || 'Admin';
            
            await renderTatiller();

            // Ayarları kaydet
            document.getElementById('formAyarlar').addEventListener('submit', async function(e) {
                e.preventDefault();
                await DB.setAyar('site_baslik', document.getElementById('ayar_site_baslik').value);
                await DB.setAyar('izin_gosterge_goster', document.getElementById('ayar_izin_gosterge_goster').value);
                
                await DB.setAyar('renk_calisiyor_bg', document.getElementById('ayar_renk_calisiyor_bg').value);
                await DB.setAyar('renk_calisiyor_text', document.getElementById('ayar_renk_calisiyor_text').value);
                await DB.setAyar('renk_izinli_bg', document.getElementById('ayar_renk_izinli_bg').value);
                await DB.setAyar('renk_izinli_text', document.getElementById('ayar_renk_izinli_text').value);
                await DB.setAyar('renk_raporlu_bg', document.getElementById('ayar_renk_raporlu_bg').value);
                await DB.setAyar('renk_raporlu_text', document.getElementById('ayar_renk_raporlu_text').value);
                await DB.setAyar('renk_kayityok_bg', document.getElementById('ayar_renk_kayityok_bg').value);
                await DB.setAyar('renk_kayityok_text', document.getElementById('ayar_renk_kayityok_text').value);
                
                document.getElementById('mesaj-alani').innerHTML = '<div class="alert alert-success alert-dismissible fade show">Ayarlar başarıyla kaydedildi.<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button></div>';
                
                // Başlığı hemen güncelle
                let mainTitle = document.querySelector('.navbar-brand');
                if (mainTitle) mainTitle.innerHTML = `<i class="fa-solid fa-clock me-2"></i>${document.getElementById('ayar_site_baslik').value}`;
            });

            // Tatil Ekle
            document.getElementById('formAddTatil').addEventListener('submit', async function(e) {
                e.preventDefault();
                const gun_ay = document.getElementById('tatil_gun_ay').value;
                const aciklama = document.getElementById('tatil_aciklama').value;
                
                await DB.addResmiTatil(gun_ay, aciklama);
                
                bootstrap.Modal.getInstance(document.getElementById('tatilEkleModal')).hide();
                document.getElementById('formAddTatil').reset();
                await renderTatiller();
            });
        });

        window.deleteTatil = async function(id) {
            if(confirm('Bu tatili silmek istediğinize emin misiniz?')) {
                await DB.deleteResmiTatil(id);
                await renderTatiller();
            }
        }

        async function renderTatiller() {
            const tatiller = await DB.getResmiTatiller();
            const tbody = document.getElementById('tatiller-table-body');
            
            if (tatiller.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted py-3">Henüz resmi tatil eklenmemiş.</td></tr>';
                return;
            }

            let html = '';
            for (let i = 0; i < tatiller.length; i++) {
                const t = tatiller[i];
                html += `
                <tr>
                    <td class="ps-3"><strong>${t.gun_ay}</strong></td>
                    <td>${t.aciklama}</td>
                    <td class="text-end pe-4">
                        <button type="button" class="btn btn-sm btn-outline-danger" onclick="deleteTatil(${t.id})">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                </tr>`;
            }
            tbody.innerHTML = html;
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
