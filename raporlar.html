<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dış Birim Mesai Takip Sistemi - Raporlar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.bootstrap5.min.css">
    <style>
        body { background-color: #f4f6f9; display: flex; flex-direction: column; min-height: 100vh; }
        .navbar-brand { font-weight: 600; min-width: 0; max-width: 50vw; line-height: 1.2; font-size: clamp(0.95rem, 2.4vw, 1.25rem); overflow-wrap: break-word; word-break: break-word; }
        @media (max-width: 991.98px) { .navbar-brand { max-width: 68vw; font-size: clamp(0.9rem, 3vw, 1.1rem); } }
        .content-wrapper { padding-top: 20px; padding-bottom: 40px; flex: 1; }
    </style>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/db.js"></script>
    <script src="assets/js/app.js"></script>

    <!-- jQuery (DataTables için) -->
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <!-- DataTables & Buttons JS -->
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/dataTables.buttons.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.bootstrap5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/pdfmake.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.7/vfs_fonts.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.html5.min.js"></script>
    <script src="https://cdn.datatables.net/buttons/2.4.1/js/buttons.print.min.js"></script>

    <script>
        let dataTable = null;

        document.addEventListener('appReady', async function() {
            if (!(await DB.isAdmin())) {
                document.getElementById('main-content').innerHTML = '<div class="alert alert-danger">Bu sayfaya erişim yetkiniz yoktur.</div>';
                return;
            }

            const today = new Date();
            const lastWeek = new Date(today);
            lastWeek.setDate(today.getDate() - 7);
            const toLS = (d) => { let dt = new Date(d); dt.setMinutes(dt.getMinutes() - dt.getTimezoneOffset()); return dt.toISOString().split('T')[0]; };
            const defaultStart = toLS(lastWeek);
            const defaultEnd = toLS(today);

            const html = `
            <div class="row">
                <div class="col-12">
                    <!-- Filtreleme Kartı -->
                    <div class="card mb-4 shadow-sm border-0 border-top border-primary border-3">
                        <div class="card-body">
                            <h5 class="card-title fw-bold text-primary mb-3"><i class="fa-solid fa-filter"></i> Rapor Filtreleri</h5>
                            <form id="filterForm" class="row g-3" onsubmit="event.preventDefault(); applyRaporFilter();">
                                <div class="col-md-2">
                                    <label class="form-label">Başlangıç Tarihi</label>
                                    <input type="date" class="form-control" id="filter_baslangic" value="${defaultStart}">
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">Bitiş Tarihi</label>
                                    <input type="date" class="form-control" id="filter_bitis" value="${defaultEnd}">
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Birim</label>
                                    <select id="filter_birim_id" class="form-select" onchange="updateRaporPersonelSelect(this.value)">
                                        <option value="0">Tüm Birimler</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Personel</label>
                                    <select id="filter_personel_id" class="form-select">
                                        <option value="0">Tüm Personeller</option>
                                    </select>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label">Durum</label>
                                    <select id="filter_durum" class="form-select">
                                        <option value="">Tümü</option>
                                        <option value="Çalışıyor">Çalışıyor</option>
                                        <option value="İzinli">İzinli</option>
                                        <option value="Raporlu">Raporlu</option>
                                        <option value="Tatil">Tatil</option>
                                    </select>
                                </div>
                                <div class="col-12 d-flex gap-2 justify-content-end">
                                    <button type="button" class="btn btn-secondary" onclick="resetRaporFilter()"><i class="fa-solid fa-times"></i> Sıfırla</button>
                                    <button type="submit" class="btn btn-primary px-4"><i class="fa-solid fa-search"></i> Raporu Getir</button>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- Rapor Tablosu -->
                    <div class="card shadow-sm border-0 mb-4">
                        <div class="card-header bg-white py-3">
                            <h5 class="mb-0 fw-bold"><i class="fa-solid fa-table"></i> Rapor Sonuçları</h5>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table id="raporTable" class="table table-hover table-bordered table-striped w-100 align-middle text-center">
                                    <thead class="table-dark">
                                        <tr>
                                            <th>Tarih</th>
                                            <th class="text-start">Personel Adı Soyadı</th>
                                            <th>Birim</th>
                                            <th>Durum</th>
                                            <th>Saat</th>
                                            <th>Notlar</th>
                                        </tr>
                                    </thead>
                                    <tbody id="rapor-table-body">
                                        <tr><td colspan="6" class="text-muted py-4">Filtre seçip "Raporu Getir" butonuna tıklayın.</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <!-- Personel Özet Tablosu -->
                    <div class="card shadow-sm border-0 border-top border-success border-3 mb-4" id="ozet-kart" style="display:none;">
                        <div class="card-header bg-white py-3">
                            <h5 class="mb-0 fw-bold text-success"><i class="fa-solid fa-chart-bar"></i> Personel Bazlı Özet</h5>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-hover mb-0 align-middle">
                                    <thead class="table-success">
                                        <tr>
                                            <th class="text-start ps-3">Personel</th>
                                            <th class="text-center">Toplam Çalışma (Gün)</th>
                                            <th class="text-center">Toplam İzin (Gün)</th>
                                            <th class="text-center">Sağlık Raporu (Gün)</th>
                                        </tr>
                                    </thead>
                                    <tbody id="ozet-table-body"></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;
            
            document.getElementById('main-content').insertAdjacentHTML('beforeend', html);
            
            // Birimleri doldur
            const birimler = await DB.getBirimler();
            let bOpts = '<option value="0">Tüm Birimler</option>';
            birimler.forEach(b => { bOpts += `<option value="${b.id}">${b.birim_adi}</option>`; });
            document.getElementById('filter_birim_id').innerHTML = bOpts;
        });

        window.updateRaporPersonelSelect = async function(birimId) {
            const personeller = parseInt(birimId) > 0 ? await DB.getPersoneller(parseInt(birimId)) : await DB.getPersoneller();
            let opts = '<option value="0">Tüm Personeller</option>';
            personeller.forEach(p => { opts += `<option value="${p.id}">${p.ad_soyad}</option>`; });
            document.getElementById('filter_personel_id').innerHTML = opts;
        };

        window.resetRaporFilter = function() {
            document.getElementById('filterForm').reset();
            document.getElementById('filter_birim_id').value = '0';
            document.getElementById('filter_personel_id').innerHTML = '<option value="0">Tüm Personeller</option>';
            document.getElementById('filter_durum').value = '';
            document.getElementById('rapor-table-body').innerHTML = '<tr><td colspan="6" class="text-muted py-4">Filtre seçip "Raporu Getir" butonuna tıklayın.</td></tr>';
            document.getElementById('ozet-kart').style.display = 'none';
            if (dataTable) { dataTable.destroy(); dataTable = null; }
        };

        window.applyRaporFilter = async function() {
            const bas = document.getElementById('filter_baslangic').value;
            const bit = document.getElementById('filter_bitis').value;
            const birimId = parseInt(document.getElementById('filter_birim_id').value) || 0;
            const personelId = parseInt(document.getElementById('filter_personel_id').value) || 0;
            const durum = document.getElementById('filter_durum').value;

            document.getElementById('rapor-table-body').innerHTML = '<tr><td colspan="6"><div class="spinner-border text-primary my-3" role="status"></div></td></tr>';

            const veriler = await DB.getMesailerAll(bas, bit, birimId > 0 ? birimId : null, personelId > 0 ? personelId : null, durum || null);
            
            const gunlerTr = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];

            // Özet verileri hesapla
            const ozetMap = {};
            
            let rows = '';
            veriler.forEach(row => {
                const d = new Date(row.tarih);
                const gunAdı = gunlerTr[d.getDay()];
                const tarihFormatli = d.toLocaleDateString('tr-TR') + ' ' + gunAdı;
                
                let durumBadge = '';
                if (row.durum === 'Çalışıyor') durumBadge = `<span class="badge bg-success">${row.durum}</span>`;
                else if (row.durum === 'İzinli') durumBadge = `<span class="badge bg-warning text-dark">${row.durum}</span>`;
                else if (row.durum === 'Raporlu') durumBadge = `<span class="badge bg-danger">${row.durum}</span>`;
                else durumBadge = `<span class="badge bg-secondary">${row.durum}</span>`;
                
                const saat = (row.baslangic_saati && row.bitis_saati) ? 
                    `${row.baslangic_saati.substring(0,5)} - ${row.bitis_saati.substring(0,5)}` : '-';
                
                rows += `<tr>
                    <td>${tarihFormatli}</td>
                    <td class="text-start">${row.ad_soyad || ''}</td>
                    <td>${row.birim_adi || ''}</td>
                    <td>${durumBadge}</td>
                    <td>${saat}</td>
                    <td class="text-start">${row.notlar || ''}</td>
                </tr>`;

                // Özet
                const pid = row.personel_id;
                if (!ozetMap[pid]) ozetMap[pid] = { ad_soyad: row.ad_soyad || '', calisma: 0, izin: 0, rapor: 0 };
                if (row.durum === 'Çalışıyor') ozetMap[pid].calisma++;
                else if (row.durum === 'İzinli') ozetMap[pid].izin++;
                else if (row.durum === 'Raporlu') ozetMap[pid].rapor++;
            });

            if (dataTable) { dataTable.destroy(); dataTable = null; }
            
            document.getElementById('rapor-table-body').innerHTML = rows || '<tr><td colspan="6" class="text-muted py-4">Sonuç bulunamadı.</td></tr>';

            if (veriler.length > 0) {
                // DataTable oluştur
                dataTable = $('#raporTable').DataTable({
                    language: { url: 'https://cdn.datatables.net/plug-ins/1.13.6/i18n/tr.json' },
                    order: [[0, 'asc']],
                    pageLength: 25,
                    dom: 'Bfrtip',
                    buttons: [
                        { extend: 'copy', text: '<i class="fa-regular fa-copy"></i> Kopyala', className: 'btn btn-sm btn-secondary' },
                        { extend: 'excel', text: '<i class="fa-solid fa-file-excel"></i> Excel İndir', className: 'btn btn-sm btn-success', title: 'Mesai Raporu' },
                        { extend: 'csv', text: '<i class="fa-solid fa-file-csv"></i> CSV', className: 'btn btn-sm btn-info' },
                        { extend: 'pdf', text: '<i class="fa-solid fa-file-pdf"></i> PDF', className: 'btn btn-sm btn-danger', orientation: 'landscape', pageSize: 'A4', title: 'Mesai Raporu' },
                        { extend: 'print', text: '<i class="fa-solid fa-print"></i> Yazdır', className: 'btn btn-sm btn-dark', title: 'Mesai Raporu' }
                    ]
                });

                // Özet Tablosu
                const ozetVeriler = Object.values(ozetMap).sort((a, b) => a.ad_soyad.localeCompare(b.ad_soyad, 'tr'));
                let ozetRows = '';
                ozetVeriler.forEach(o => {
                    ozetRows += `<tr>
                        <td class="ps-3 fw-bold">${o.ad_soyad}</td>
                        <td class="text-center"><span class="badge bg-success">${o.calisma}</span></td>
                        <td class="text-center"><span class="badge bg-warning text-dark">${o.izin}</span></td>
                        <td class="text-center"><span class="badge bg-danger">${o.rapor}</span></td>
                    </tr>`;
                });
                document.getElementById('ozet-table-body').innerHTML = ozetRows;
                document.getElementById('ozet-kart').style.display = 'block';
            } else {
                document.getElementById('ozet-kart').style.display = 'none';
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
