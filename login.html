<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Dış Birim Mesai Takip Sistemi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { 
            background-color: #f4f6f9; 
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <div class="card login-card border-0">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="bg-primary text-white d-inline-flex justify-content-center align-items-center rounded-circle mb-3" style="width: 60px; height: 60px;">
                    <i class="fa-solid fa-clock fs-3"></i>
                </div>
                <h4 class="fw-bold text-dark">Mesai Takip Sistemi</h4>
                <p class="text-muted">Lütfen giriş yapın</p>
            </div>

            <div id="hata-alani"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label fw-bold">E-posta</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-envelope text-muted"></i></span>
                        <input type="email" class="form-control border-start-0 ps-0" id="kullanici_adi" placeholder="admin@ornek.com" required>
                    </div>
                </div>
                
                <div class="mb-4">
                    <label class="form-label fw-bold">Şifre</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                        <input type="password" class="form-control border-start-0 ps-0" id="sifre" placeholder="123456" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> Giriş Yap
                </button>
            </form>
            
            <div class="text-center mt-4">
                <small class="text-muted">Not: Bu yerel (çevrimdışı) sürümdür. Herhangi bir şifre ile giriş yapabilirsiniz.</small>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/db.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('kullanici_adi').value;
            const sifre = document.getElementById('sifre').value;

            document.getElementById('hata-alani').innerHTML = '<div class="alert alert-info">Giriş yapılıyor...</div>';

            const loginResult = await DB.login(email, sifre);
            if (loginResult && loginResult.success) {
                window.location.href = 'index.html';
            } else {
                document.getElementById('hata-alani').innerHTML = '<div class="alert alert-danger">Giriş başarısız. Lütfen bilgilerinizi kontrol edin.</div>';
            }
        });

        // Eğer zaten giriş yapılmışsa ana sayfaya yönlendir
        (async function() {
            if (await DB.isAdmin()) {
                window.location.href = 'index.html';
            }
        })();
    </script>
</body>
</html>
